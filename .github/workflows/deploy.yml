name: Deploy to GitHub Pages

# The build itself lives in .github/actions/build-app so that this workflow and
# ci.yml run byte-identical steps. Change the build there, not here.
on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race each other.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build app
        uses: ./.github/actions/build-app

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: svelte-app/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
