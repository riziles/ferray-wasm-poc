name: CI

# Build-only verification. `deploy.yml` only runs on main, so without this a
# broken toolchain bump would not be discovered until it was already merged
# and live. Both workflows share .github/actions/build-app, so this really does
# exercise the same steps the deploy uses.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build app
        uses: ./.github/actions/build-app
