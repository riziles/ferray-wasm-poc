<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e1b4b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:0.20"/>
      <stop offset="100%" style="stop-color:#38bdf8;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <text x="70" y="100" font-family="system-ui,sans-serif" font-weight="bold" font-size="52" fill="#e2e8f0">The Kakeya Conjecture</text>
  <text x="70" y="144" font-family="system-ui,sans-serif" font-size="24" fill="#94a3b8">A needle, a room of zero area, and five live experiments</text>

  <!-- the room: equilateral triangle of height 1, with a unit needle across it -->
  <ellipse cx="310" cy="440" rx="250" ry="180" fill="url(#glow)"/>
  <polygon points="310,250 470,530 150,530" fill="rgba(56,189,248,0.10)" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.8"/>
  <line x1="240" y1="390" x2="380" y2="390" stroke="#fde047" stroke-width="7" stroke-linecap="round"/>
  <circle cx="240" cy="390" r="6" fill="#0b1020" stroke="#fef08a" stroke-width="2"/>
  <circle cx="380" cy="390" r="6" fill="#0b1020" stroke="#fef08a" stroke-width="2"/>
  <text x="310" y="578" text-anchor="middle" font-family="monospace" font-size="17" fill="#7dd3fc">equilateral, height 1 · area 1/√3 ≈ 0.577</text>

  <!-- right column: what the page lets you do -->
  <text x="650" y="230" font-family="system-ui,sans-serif" font-weight="bold" font-size="26" fill="#e2e8f0">Live on the page</text>
  <circle cx="658" cy="270" r="5" fill="#f87171"/>
  <text x="678" y="276" font-family="system-ui,sans-serif" font-size="19" fill="#cbd5e1">turn a unit needle in four shapes</text>
  <circle cx="658" cy="312" r="5" fill="#fbbf24"/>
  <text x="678" y="318" font-family="system-ui,sans-serif" font-size="19" fill="#cbd5e1">Perron trees: area falls, directions stay</text>
  <circle cx="658" cy="354" r="5" fill="#38bdf8"/>
  <text x="678" y="360" font-family="system-ui,sans-serif" font-size="19" fill="#cbd5e1">count boxes, measure the dimension</text>
  <circle cx="658" cy="396" r="5" fill="#a78bfa"/>
  <text x="678" y="402" font-family="system-ui,sans-serif" font-size="19" fill="#cbd5e1">tubes, and a focusing wave</text>

  <!-- a small needle fan: eight directions from one point -->
  <g transform="translate(900,470)">
    <g stroke="#38bdf8" stroke-width="3" stroke-opacity="0.55" stroke-linecap="round">
      <line x1="0" y1="0" x2="0" y2="-96"/>
      <line x1="0" y1="0" x2="68" y2="-68"/>
      <line x1="0" y1="0" x2="96" y2="0"/>
      <line x1="0" y1="0" x2="68" y2="68"/>
      <line x1="0" y1="0" x2="0" y2="96"/>
      <line x1="0" y1="0" x2="-68" y2="68"/>
      <line x1="0" y1="0" x2="-96" y2="0"/>
      <line x1="0" y1="0" x2="-68" y2="-68"/>
    </g>
    <line x1="0" y1="0" x2="73" y2="-73" stroke="#fde047" stroke-width="6" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="6" fill="#fde047"/>
  </g>

  <text x="70" y="602" font-family="monospace" font-size="16" fill="#f59e0b">local smoothing ⇒ Kakeya, in every dimension</text>
  <text x="1130" y="602" text-anchor="end" font-family="monospace" font-size="15" fill="#7c8ba1">riziles.github.io/ferray-wasm-poc/kakeya</text>
</svg>
