<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#2a1030"/>
    </linearGradient>
    <linearGradient id="fur" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c4b5fd"/>
      <stop offset="60%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5eead4"/>
      <stop offset="100%" style="stop-color:#2dd4bf"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="760" cy="330" rx="520" ry="330" fill="url(#glow)"/>

  <text x="70" y="96" font-family="system-ui,sans-serif" font-weight="bold" font-size="54" fill="#e2e8f0">Object Folio</text>
  <text x="70" y="140" font-family="system-ui,sans-serif" font-size="24" fill="#94a3b8">Eight Three.js objects — and one very long cat</text>
  <text x="70" y="184" font-family="monospace" font-size="19" fill="#7dd3fc">threlte · 4 material presets · parametric surfaces</text>

  <!-- the catoid: one lap around the shapes, head first -->
  <path d="M130,470 C132,310 310,258 480,282 C650,306 710,404 650,478 C600,540 448,532 420,466 C398,410 470,378 544,402"
        fill="none" stroke="#8b5cf6" stroke-width="30" stroke-linecap="round" opacity="0.95"/>
  <path d="M130,470 C132,310 310,258 480,282 C650,306 710,404 650,478 C600,540 448,532 420,466 C398,410 470,378 544,402"
        fill="none" stroke="#c4b5fd" stroke-width="9" stroke-linecap="round" opacity="0.55"/>

  <!-- four of the eight objects, inside the lap -->
  <ellipse cx="482" cy="272" rx="44" ry="30" fill="none" stroke="#ff8a3d" stroke-width="17"/>
  <polygon points="586,230 634,258 622,306 568,316 536,276" fill="url(#teal)"/>
  <circle cx="700" cy="352" r="40" fill="#facc15"/>
  <polygon points="612,444 624,414 648,430 676,410 680,444 656,466 626,464" fill="#fb7185"/>

  <!-- head, at the front of the lap -->
  <g transform="translate(130,470)">
    <polygon points="-34,-24 -50,-78 -10,-52" fill="url(#fur)"/>
    <polygon points="34,-24 50,-78 10,-52" fill="url(#fur)"/>
    <polygon points="-30,-34 -42,-66 -18,-50" fill="#f9a8d4"/>
    <polygon points="30,-34 42,-66 18,-50" fill="#f9a8d4"/>
    <circle cx="0" cy="0" r="54" fill="url(#fur)"/>

    <!-- eyes -->
    <ellipse cx="-20" cy="-10" rx="15" ry="12" fill="#d4ff2a"/>
    <ellipse cx="20" cy="-10" rx="15" ry="12" fill="#d4ff2a"/>
    <rect x="-22" y="-22" width="4" height="24" rx="2" fill="#05050a"/>
    <rect x="18" y="-22" width="4" height="24" rx="2" fill="#05050a"/>

    <!-- whiskers -->
    <path d="M-30,10 L-70,2 M-30,16 L-70,20 M30,10 L70,2 M30,16 L70,20"
          stroke="#f8fafc" stroke-width="2" opacity="0.75" fill="none"/>

    <!-- the grin -->
    <path d="M-46,6 Q0,52 46,6" stroke="#160410" stroke-width="26" fill="none" stroke-linecap="round"/>
    <path d="M-38,8 Q0,42 38,8" stroke="#fffdf3" stroke-width="15" fill="none" stroke-linecap="round"/>
    <path d="M-26,16 L-24,30 M-9,24 L-8,40 M9,24 L8,40 M26,16 L24,30"
          stroke="#2a0714" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <text x="70" y="598" font-family="monospace" font-size="18" fill="#475569">riziles.github.io/ferray-wasm-poc/objects</text>
</svg>
