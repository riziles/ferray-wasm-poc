<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e1b4b"/>
    </linearGradient>
    <radialGradient id="topsheet" cx="50%" cy="50%" r="55%">
      <stop offset="0%" style="stop-color:#e8c94a"/>
      <stop offset="38%" style="stop-color:#7ede9c"/>
      <stop offset="100%" style="stop-color:#86efac"/>
    </radialGradient>
    <radialGradient id="botsheet" cx="50%" cy="42%" r="60%">
      <stop offset="0%" style="stop-color:#8a86e8"/>
      <stop offset="45%" style="stop-color:#e8a0a0"/>
      <stop offset="100%" style="stop-color:#f2a5a5"/>
    </radialGradient>
    <linearGradient id="throat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e8c94a"/>
      <stop offset="40%" style="stop-color:#e8c94a"/>
      <stop offset="70%" style="stop-color:#8a86e8"/>
      <stop offset="100%" style="stop-color:#d898a8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Title -->
  <text x="70" y="100" font-family="system-ui,sans-serif" font-weight="bold" font-size="50" fill="#e2e8f0">Wormhole Embedding Diagram</text>
  <text x="70" y="140" font-family="system-ui,sans-serif" font-size="24" fill="#94a3b8">Two Sheets, One Throat · Interactive 3D in Rust WASM</text>

  <!-- ── the wormhole (mirrors the live renderer's classic palette) ── -->
  <!-- throat (drawn first: its feet tuck under the sheets) -->
  <path d="M283,258 C294,318 306,352 300,470 L400,470 C394,352 406,318 417,258 Z" fill="url(#throat)"/>
  <!-- bottom sheet -->
  <ellipse cx="350" cy="480" rx="228" ry="75" fill="url(#botsheet)" stroke="#334155" stroke-width="1.5"/>
  <!-- top sheet -->
  <ellipse cx="350" cy="252" rx="252" ry="85" fill="url(#topsheet)" stroke="#334155" stroke-width="1.5"/>
  <!-- hole -->
  <ellipse cx="350" cy="254" rx="66" ry="23" fill="#0d1126" stroke="#8a86e8" stroke-width="2"/>
  <!-- traveler + trail -->
  <circle cx="452" cy="216" r="4" fill="#fbbf24" opacity="0.55"/>
  <circle cx="468" cy="210" r="4.5" fill="#fbbf24" opacity="0.7"/>
  <circle cx="484" cy="205" r="5" fill="#fbbf24" opacity="0.85"/>
  <circle cx="500" cy="201" r="6" fill="#fde68a"/>
  <circle cx="500" cy="201" r="3" fill="#ffffff"/>

  <!-- Right column -->
  <text x="700" y="240" font-family="system-ui,sans-serif" font-weight="bold" font-size="26" fill="#e2e8f0">What you'll see</text>

  <circle cx="704" cy="292" r="5" fill="#86efac"/>
  <text x="722" y="298" font-family="system-ui,sans-serif" font-size="19" fill="#cbd5e1">Ellis catenoid — the traversable</text>
  <text x="722" y="326" font-family="monospace" font-size="21" fill="#7dd3fc">r(z) = b₀·cosh(z / b₀)</text>

  <circle cx="704" cy="374" r="5" fill="#fbbf24"/>
  <text x="722" y="380" font-family="system-ui,sans-serif" font-size="19" fill="#cbd5e1">Flamm paraboloid — Schwarzschild</text>
  <text x="722" y="408" font-family="monospace" font-size="21" fill="#7dd3fc">r(z) = rₛ + z² / (4·rₛ)</text>

  <circle cx="704" cy="456" r="5" fill="#8a86e8"/>
  <text x="722" y="462" font-family="system-ui,sans-serif" font-size="19" fill="#cbd5e1">Weld the construction: cut sheets,</text>
  <text x="722" y="488" font-family="system-ui,sans-serif" font-size="19" fill="#cbd5e1">glowing rims → one manifold</text>

  <circle cx="704" cy="536" r="5" fill="#fbbf24"/>
  <text x="722" y="542" font-family="system-ui,sans-serif" font-size="19" fill="#cbd5e1">Drag to orbit · ride the traveler</text>
  <text x="722" y="568" font-family="system-ui,sans-serif" font-size="19" fill="#cbd5e1">straight through the throat</text>

  <text x="600" y="600" text-anchor="middle" font-family="monospace" font-size="16" fill="#7c8ba1">riziles.github.io/ferray-wasm-poc/wormhole</text>
</svg>
