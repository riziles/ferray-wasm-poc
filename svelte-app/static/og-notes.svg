  <text x="70" y="176" font-family="system-ui,sans-serif" font-weight="bold" font-size="58" fill="#e2e8f0">How to build a catoid</text>
  <text x="70" y="222" font-family="system-ui,sans-serif" font-size="24" fill="#94a3b8">Seventeen attempts at one absurd 3D animal</text>
  <text x="70" y="262" font-family="system-ui,sans-serif" font-size="24" fill="#94a3b8">— and the geometry that kept saying no.</text>

