  <text x="70" y="420" font-family="monospace" font-size="19" fill="#94a3b8">03 the head that would not fit</text>
  <text x="70" y="454" font-family="monospace" font-size="19" fill="#94a3b8">04 a grin that read as a zipper</text>
  <text x="70" y="520" font-family="monospace" font-size="18" fill="#475569">19 screenshots · 5 commits · 1 draft PR</text>

